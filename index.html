<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel My Body & Mind - Sorting Activity</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif, system-ui;
            background: linear-gradient(135deg, #e0f7fa, #fff9c4);
            margin: 0;
            padding: 15px;
            color: #333;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            font-size: 1.8rem;
            margin: 5px 0 15px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .instructions {
            text-align: center;
            font-size: 1.1rem;
            color: #455a64;
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: 0 auto 15px auto;
            border: 2px dashed #81c784;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Categories Section (Drop Zones) */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (max-width: 600px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }

        .category-box {
            background: #ffffff;
            border: 4px solid #b0bec5;
            border-radius: 20px;
            padding: 15px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-box.highlight-target {
            border-color: #2e7d32;
            background: #e8f5e9;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(46, 125, 50, 0.4);
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .items-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            justify-content: center;
            pointer-events: none; /* Allows taps anywhere inside box to bubble up */
        }

        /* Specific Category Theme Colors */
        #cat-energy { border-color: #ffa726; background: #fff8e1; }
        #cat-energy .category-title { color: #e65100; }

        #cat-muscle { border-color: #ab47bc; background: #f3e5f5; }
        #cat-muscle .category-title { color: #6a1b9a; }

        #cat-hydrate { border-color: #29b6f6; background: #e1f5fe; }
